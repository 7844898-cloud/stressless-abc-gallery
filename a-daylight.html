  <script>
    (() => {
      'use strict';
      const $ = selector => document.querySelector(selector);
      const input = $('#chat-input'), feed = $('#chat-feed'), send = $('#send');
      const icon = name => '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
      if (!window.Gallery) { const notice=document.createElement('p'); notice.className='network-notice'; notice.textContent='示例图库尚未就绪，请确认 assets/core.js 与本页在同一文件夹后刷新。';$('#workspace').prepend(notice);return; }
      let filters=Gallery.empty(), draft=Gallery.empty(), busy=false, pendingTimer=null, requestVersion=0, lastFocus=null;
      const esc=Gallery.escape;
      function selectedChips(){return Gallery.chips(filters)}
      function scrollToBottom(){requestAnimationFrame(()=>{feed.scrollTo({top:feed.scrollHeight,behavior:'smooth'});});}
      function updateActive(){
        const chips=selectedChips();$('#filter-counter').textContent=String(chips.length);$('#filter-counter').hidden=chips.length===0;
        const area=$('#current-filters');area.hidden=chips.length===0;
        area.innerHTML='<span class="current-filters-label">正在查找</span>'+chips.map(c=>'<button class="active-chip" type="button" data-remove-key="'+esc(c.key)+'" data-remove-value="'+esc(c.value)+'" aria-label="移除 '+esc(c.value)+'">'+esc(c.value)+icon('close')+'</button>').join('')+'<button class="clear-active" type="button" id="clear-active">全部清空</button>';
        send.disabled=busy||!input.value.trim();
      }
      function addUser(text){document.body.classList.add('is-chat');const div=document.createElement('div');div.className='message user-message';div.textContent=text;feed.appendChild(div);}
      function assistantShell(){const el=document.createElement('article');el.className='message assistant-message';el.innerHTML='<div class="assistant-avatar">'+icon('spark')+'</div><div class="assistant-body"><p class="assistant-name">Stressless 图像助手</p><div class="answer-content"></div></div>';return el;}
      function card(item){const meta=[item.fabric||item.material,item.base].filter(Boolean).join(' · '),kind=item.type.includes('白底')?'type-white':item.type.includes('人物')?'type-person':'type-scene';return '<button class="result-card '+kind+'" type="button" data-item-id="'+esc(String(item.id))+'" aria-label="查看 '+esc(item.title)+' '+esc(item.type)+' 详情"><div class="card-image"><img src="'+esc(item.img)+'" alt="'+esc(item.title)+' · '+esc(item.type)+'" loading="lazy"><span class="card-type">'+esc(item.type)+'</span><span class="image-open">'+icon('expand')+'</span></div><div class="card-info"><h3 class="card-title">'+esc(item.title)+'</h3><p class="card-meta">'+esc(meta||item.tags.slice(0,3).join(' · '))+'</p></div></button>';}
      function renderAnswer(text,explanation,unrecognized=false){
        const answer=assistantShell(), content=answer.querySelector('.answer-content'), snapshot=Gallery.clone(filters), chips=Gallery.chips(snapshot), matches=Gallery.match(snapshot);
        answer._snapshot=snapshot;answer._query=text;
        if(unrecognized){
          content.innerHTML='<h2 class="answer-title">我还需要一点关于产品的信息。</h2><p class="answer-explanation">这句描述暂未识别到示例图库中的标签；已有条件已保留。</p><div class="empty-result">'+icon('search')+'<h3>可以从产品、材质或底座开始</h3><p>试试「艾瑞克皮革场景图」，或在标签筛选中选择。</p><div class="empty-actions"><button class="mini-action" type="button" data-query="找艾瑞克皮革场景图">艾瑞克皮革场景图</button><button class="mini-action" type="button" data-open-filter>打开标签筛选</button></div></div>';
        } else {
          content.innerHTML='<h2 class="answer-title">'+(matches.length?'找到 <strong>'+matches.length+' 张</strong>图片，看看这些。':'这组条件下，暂时没有图片。')+'</h2><p class="answer-explanation">'+esc(explanation||'已按当前条件筛选本地示例图库。')+'</p>'+(chips.length?'<div class="result-filters">'+chips.map(c=>'<span class="result-filter">'+esc(c.value)+'</span>').join('')+'</div>':'')+(matches.length?'<div class="result-grid">'+matches.map(card).join('')+'</div><p class="answer-followup">点开图片查看详情，也可以继续说「换成柏林」或「只看白底图」。</p>':'<div class="empty-result">'+icon('search')+'<h3>试着少选一个条件</h3><p>示例图库有限，未匹配到不代表真实图库没有。可以移除部分标签，或选择其他产品。</p><div class="empty-actions"><button class="mini-action" type="button" data-open-filter>调整筛选条件</button><button class="mini-action" type="button" data-clear-query>查看全部示例图片</button></div></div>');
        }
        feed.appendChild(answer);return answer;
      }
      function runQuery(text,settings={}){
        text=String(text||'').trim();if(!text||busy)return;
        let parsed=null;
        if(settings.filters){filters=Gallery.clone(settings.filters);}else{parsed=Gallery.query(text,filters);filters=Gallery.clone(parsed.filters);}
        const unrecognized=!!parsed&&parsed.recognized.length===0&&parsed.unknown;
        addUser(text);updateActive();input.value='';input.style.height='';if(matchMedia('(pointer:coarse)').matches)input.blur();busy=true;send.disabled=true;
        const pending=assistantShell();pending.querySelector('.answer-content').innerHTML='<div class="pending"><i></i><i></i><i></i><span>正在筛选本地示例图库</span></div>';feed.appendChild(pending);scrollToBottom();
        const version=++requestVersion;pendingTimer=setTimeout(()=>{if(version!==requestVersion)return;pending.remove();busy=false;renderAnswer(text,settings.explanation||(parsed&&parsed.explanation),unrecognized);updateActive();scrollToBottom();},280);
      }
      function openFilters(){
        if(busy)return;lastFocus=document.activeElement;draft=Gallery.clone(filters);$('#filter-backdrop').hidden=false;document.body.style.overflow='hidden';renderDraft();$('#close-filters').focus();

      function closeFilters(){

      }
      function renderDraft(){
        $('#filter-groups').innerHTML=Gallery.filterHTML(draft);const count=Gallery.chips(draft).length,matches=Gallery.match(draft).length;
        $('#selected-count').textContent='已选 '+count+' 个标签';$('#apply-filters').textContent='查看 '+matches+' 张图片';$('#filter-preview').innerHTML=matches?'这些条件可找到 <strong>'+matches+' 张</strong>本地示例图片。':'暂无匹配图片。可以减少条件；仍可应用并查看空结果。';
      }
      function clearAndQuery(){if(busy)return;runQuery('查看全部示例图片',{filters:Gallery.empty(),explanation:'已清空条件，显示全部本地示例图片。'});}
      $('#composer-form').addEventListener('submit',event=>{event.preventDefault();runQuery(input.value);});
      input.addEventListener('input',()=>{send.disabled=busy||!input.value.trim();input.style.height='auto';input.style.height=Math.min(input.scrollHeight,parseFloat(getComputedStyle(input).maxHeight)||130)+'px';});
      input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();if(!send.disabled)runQuery(input.value);}});
      $('#open-filters').addEventListener('click',openFilters);$('#close-filters').addEventListener('click',closeFilters);$('#cancel-filters').addEventListener('click',closeFilters);
      $('#filter-backdrop').addEventListener('click',event=>{if(event.target===$('#filter-backdrop'))closeFilters();});
      $('#reset-filters').addEventListener('click',()=>{draft=Gallery.empty();renderDraft();$('#reset-filters').focus();});
      $('#filter-groups').addEventListener('click',event=>{const button=event.target.closest('[data-filter-key]');if(!button)return;const key=button.dataset.filterKey,value=button.dataset.filterValue;Gallery.toggle(draft,key,value);renderDraft();const next=Array.from($('#filter-groups').querySelectorAll('[data-filter-key]')).find(el=>el.dataset.filterKey===key&&el.dataset.filterValue===value);if(next)next.focus();});
      $('#apply-filters').addEventListener('click',()=>{const next=Gallery.clone(draft),chips=Gallery.chips(next);closeFilters();runQuery(chips.length?'按标签查找：'+chips.map(c=>c.value).join('、'):'查看全部示例图片',{filters:next,explanation:'已应用标签筛选。接下来可以继续对话调整这些条件。'});});
      document.addEventListener('keydown',event=>{
        if($('#filter-backdrop').hidden)return;
        if(event.key==='Escape'){event.preventDefault();closeFilters();}
        if(event.key==='Tab'){const focusables=Array.from($('#filter-sheet').querySelectorAll('button:not([disabled]),[href],[tabindex]:not([tabindex="-1"])')).filter(el=>el.getClientRects().length);const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
      });
      document.addEventListener('click',event=>{
        const queryButton=event.target.closest('[data-query]');if(queryButton){runQuery(queryButton.dataset.query);return;}
        const openButton=event.target.closest('[data-open-filter]');if(openButton){openFilters();return;}
        if(event.target.closest('[data-clear-query]')||event.target.closest('#clear-active')){clearAndQuery();return;}
        const removeButton=event.target.closest('[data-remove-key]');if(removeButton&&!busy){const next=Gallery.clone(filters);Gallery.toggle(next,removeButton.dataset.removeKey,removeButton.dataset.removeValue);runQuery('移除「'+removeButton.dataset.removeValue+'」',{filters:next,explanation:'已移除此标签，其余条件继续保留。'});return;}
        const result=event.target.closest('[data-item-id]');if(result){const message=result.closest('.assistant-message');Gallery.openDetail(result.dataset.itemId,{query:message._query,filters:message._snapshot});}
      });
      $('#new-chat').addEventListener('click',()=>{clearTimeout(pendingTimer);requestVersion++;busy=false;filters=Gallery.empty();draft=Gallery.empty();feed.innerHTML='';input.value='';input.style.height='';document.body.classList.remove('is-chat');updateActive();window.scrollTo({top:0,behavior:'smooth'});input.focus({preventScroll:true});});
      updateActive();
    })();
  </script>
</body>
</html>
