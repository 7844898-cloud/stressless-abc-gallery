<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stressless · PC / 手机实时预览</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef1eb;color:#3f503c}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid #d9e0d3;border-radius:6px;padding:10px 14px;background:#fff;font-size:12px;min-height:42px}button[aria-pressed=true]{background:#647c59;color:white;border-color:#647c59}a{color:inherit;text-decoration:none;font-size:12px;white-space:nowrap}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #8da27e;outline-offset:3px}.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 25px;background:#fafbf8;border-bottom:1px solid #dce3d5;flex-wrap:wrap}.identity{display:flex;align-items:center;gap:22px}.identity img{width:99px;height:auto}.identity span{font-size:12px;letter-spacing:1px}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.group{display:flex;gap:5px}.right{display:flex;gap:15px;align-items:center}.meta{display:flex;justify-content:space-between;align-items:center;padding:15px 26px 0;font-size:11px;color:#7b8a72;gap:15px}.meta select{border:1px solid #d5decf;background:#f9fbf6;border-radius:5px;font-size:12px;min-height:36px;padding:5px 9px}.stage{height:calc(100dvh - 138px);min-height:390px;padding:20px;display:flex;justify-content:center;align-items:center;overflow:hidden}.frame-space{position:relative;flex:none}.frame{position:absolute;top:0;left:0;transform-origin:top left;overflow:hidden;background:white;border:1px solid #c9d2c1;box-shadow:0 12px 40px #34432c16;border-radius:8px}.frame.phone{border:6px solid #d2d8ce;border-radius:25px}.frame iframe{display:block;border:0;width:100%;height:100%;background:#fff}.hint{text-align:center;font-size:10px;color:#829078;margin:0;padding:0 15px 10px}@media(max-width:820px){.bar{gap:12px;padding:10px 15px}.identity span{display:none}.identity img{width:82px}.controls{gap:10px}.right{gap:10px}.group button{padding:8px 11px;font-size:11px}.right a{font-size:10px}.meta{padding:12px 16px 0;font-size:10px}.stage{padding:12px;height:calc(100dvh - 188px);min-height:380px}.meta span{max-width:180px;line-height:1.7}}@media(max-width:520px){.bar{display:grid;grid-template-columns:1fr auto}.controls{grid-column:1/-1;grid-row:2;justify-content:space-between;flex-wrap:nowrap}.right{grid-row:1;grid-column:2}.group{gap:4px}.group button{min-height:42px;padding:8px 12px}.identity{gap:0}.meta select{max-width:155px;font-size:11px}.stage{height:calc(100dvh - 235px);min-height:350px}.hint{font-size:9px}}
</style></head><body><header class="bar"><a class="identity" href="index.html"><img src="assets/stressless-official.png" alt="Stressless 思特莱斯官方标志"><span>实时设计预览</span></a><div class="controls"><div class="group" aria-label="选择设计方案"><button data-design="a" type="button">A 白昼</button><button data-design="b" type="button">B 林间</button><button data-design="c" type="button">C 雾湾</button></div><div class="group" aria-label="选择设备"><button data-device="pc" type="button">PC</button><button data-device="mobile" type="button">手机</button></div></div><nav class="right"><a href="index.html">返回选型</a><a id="direct" href="a-daylight.html" target="_blank" rel="noopener">全屏打开 ↗</a></nav></header><div class="meta"><span id="meta-label">真实页面，可直接输入和筛选</span><select id="size" aria-label="选择预览屏幕尺寸"></select></div><main class="stage" id="stage"><div class="frame-space" id="frame-space"><div class="frame" id="frame"><iframe id="app" title="Stressless 可交互原型" src="about:blank"></iframe></div></div></main><p class="hint">这里加载的是可操作页面。切换 PC / 手机会即时重新排版；全屏打开后会自动适应你的设备。</p><script>
(()=>{const files={a:'a-daylight.html',b:'b-forest.html',c:'c-fjord.html'},names={a:'白昼',b:'林间',c:'雾湾'},presets={pc:[[1440,900,'标准 PC · 1440 × 900'],[1280,720,'小型 PC · 1280 × 720'],[1920,1080,'宽屏 PC · 1920 × 1080']],mobile:[[390,844,'手机 · 390 × 844'],[375,667,'手机 · 375 × 667'],[320,568,'小屏 · 320 × 568'],[430,932,'大屏 · 430 × 932'],[844,390,'手机横屏 · 844 × 390'],[834,1112,'Pad · 834 × 1112']]};const $=s=>document.querySelector(s),q=new URLSearchParams(location.search);const requested=q.get('design')==='d'?'c':q.get('design');let design=files[requested]?requested:'a',device=q.get('device')==='mobile'?'mobile':'pc';let current=[...presets[device][0]];
function fit(){const pad=device==='mobile'?12:2,w=current[0]+pad,h=current[1]+pad,stage=$('#stage'),scale=Math.min(1,(stage.clientWidth-28)/w,(stage.clientHeight-28)/h);$('#frame').style.width=w+'px';$('#frame').style.height=h+'px';$('#frame').style.transform=`scale(${scale})`;$('#frame-space').style.width=w*scale+'px';$('#frame-space').style.height=h*scale+'px';$('#frame').classList.toggle('phone',device==='mobile');$('#meta-label').textContent=`方案 ${design.toUpperCase()} · ${names[design]} / ${current[0]} × ${current[1]} · 实时交互`;}
function state(){document.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.design===design));document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.device===device));const u=new URL(location.href);u.searchParams.set('design',design);u.searchParams.set('device',device);history.replaceState(null,'',u);$('#direct').href=files[design];$('#app').title=`方案${design.toUpperCase()}${names[design]} ${device==='pc'?'PC':'手机'}实时原型`;}
function sizes(){const list=presets[device];$('#size').innerHTML=list.map((s,i)=>`<option value="${i}">${s[2]}</option>`).join('');current=[...list[0]];fit();}
document.querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>{design=b.dataset.design;$('#app').src=files[design];state();fit()});document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{device=b.dataset.device;sizes();state()});$('#size').onchange=()=>{current=[...presets[device][Number($('#size').value)]];fit()};window.addEventListener('resize',fit);$('#app').src=files[design];sizes();state();
})();
</script></body></html>
